name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # website: /?show_icons=true&title_color=af87ba&text_color=eeeeee&bg_color=1f2d50&icon_color=af87ba&border_color=af87ba&hide_rank=true
      - name: Generate website stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&title_color=af87ba&text_color=eeeeee&bg_color=1f2d50&icon_color=af87ba&border_color=af87ba&hide_rank=true
          path: profile/web-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # website: /top-langs/?title_color=af87ba&text_color=eeeeee&bg_color=1f2d50&border_color=af87ba
      - name: Generate website top-langs card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&title_color=af87ba&text_color=eeeeee&bg_color=1f2d50&border_color=af87ba
          path: profile/web-top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # github: /?show_icons=true&hide_rank=true
      - name: Generate github stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true
          path: profile/gh-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # github: /top-langs/?
      - name: Generate top-langs card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}
          path: profile/gh-top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push

